baseURL: https://coding-overhead.com/
defaultContentLanguage: en
title: Coding Overhead
theme:
  - github.com/ismd/hugo-theme-vng-blue
enableRobotsTXT: true

module:
  imports:
    - path: github.com/ismd/hugo-theme-vng-blue

menus:
  main:
    - name: Home
      pageRef: /
      weight: 10
    - name: Posts
      pageRef: /posts
      weight: 20
    - name: Categories
      pageRef: /categories
      weight: 30
    - name: Tags
      pageRef: /tags
      weight: 40
    - name: About
      pageRef: /about
      weight: 50

params:
  author: ismd
  social:
    discord: "https://discord.gg/JTjbUVuNy"
    facebook:
    github: "https://github.com/ismd"
    instagram:
    linkedin: "https://www.linkedin.com/in/ismdev/"
    telegram: "https://t.me/CodingOverhead"
    twitch: "https://www.twitch.tv/codingoverhead"
    whatsapp:
    x:
    youtube: "https://www.youtube.com/@CodingOverhead"

  giscus:
    enable: true

  custom_script_inline: |
    <script src="https://giscus.app/client.js"
            data-repo="ismd/coding-overhead.com"
            data-repo-id="R_kgDOM8wE5g"
            data-category="Announcements"
            data-category-id="DIC_kwDOM8wE5s4Cu5WQ"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="en"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VF99R1ZB2Z"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-VF99R1ZB2Z');
    </script>


  homeEventPosition: "none"
  homeToBlogText: "Blog"
  description: "Hello, friend. Coding Overhead is&nbsp;my&nbsp;personal blog about modern tech and useful tools."
  mailMeText: "Email&nbsp;me"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: friendly

caches:
  images:
    dir: :cacheDir/images

permalinks:
  posts: /posts/:contentbasename/
