baseURL: https://coding-overhead.com/
defaultContentLanguage: en
title: Coding Overhead
theme:
  - github.com/ismd/hugo-theme-vng-blue
enableRobotsTXT: true

module:
  imports:
    - path: github.com/ismd/hugo-theme-vng-blue

menus:
  main:
    - name: Home
      pageRef: /
      weight: 10
    - name: Posts
      pageRef: /posts
      weight: 20
    - name: Categories
      pageRef: /categories
      weight: 30
    - name: Tags
      pageRef: /tags
      weight: 40
    - name: About
      pageRef: /about
      weight: 50

params:
  author: ismd
  social:
    discord: "https://discord.gg/JTjbUVuNy"
    facebook:
    github: "https://github.com/ismd"
    instagram:
    linkedin: "https://www.linkedin.com/in/ismdev/"
    telegram: "https://t.me/CodingOverhead"
    twitch: "https://www.twitch.tv/codingoverhead"
    whatsapp:
    x:
    youtube: "https://www.youtube.com/@CodingOverhead"

  giscus:
